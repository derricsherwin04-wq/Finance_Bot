[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finch-rag"
version = "0.1.0"
description = "A local-first, low-footprint RAG assistant for finance students"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
finch = "finch.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
